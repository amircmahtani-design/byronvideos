name: Regression checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-api-style:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BYRON_REQUIRE_MEDIA_TESTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install media-test runtime
        run: sudo --preserve-env=GITHUB_ACTIONS python3 scripts/install_ci_ffmpeg.py
      - run: python -m pip install -r requirements-test.txt
      - run: python -m byron_video.style --check
      - run: python -m pytest -q
      - run: node --test web/core.test.mjs
      - run: node --check web/app.mjs
